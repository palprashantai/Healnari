<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <meta name="theme-color" content="#2A1647" />
    <link rel="icon" href="/brand/logo-icon.jpg" type="image/jpeg" />
    <link rel="apple-touch-icon" href="/brand/logo-icon.jpg" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HealNari" />
    <link rel="canonical" href="https://healnari.care" />
    <link rel="alternate" hreflang="en-US" href="https://healnari.care" />
    <link rel="alternate" hreflang="en-GB" href="https://healnari.care" />
    <link rel="alternate" hreflang="en-AE" href="https://healnari.care" />
    <link rel="alternate" hreflang="en-IN" href="https://healnari.care" />
    <link rel="alternate" hreflang="x-default" href="https://healnari.care" />

    <!-- SEO Optimization -->
    <title>Online PCOS Treatment & Gynaecologist Consultations | HealNari</title>
    <meta name="description" content="Root-cause diagnosis and personalized treatment plans for PCOS, PCOD, hair fall, acne, and hormonal imbalances. Private & confidential care led by top gynaecologists and endocrinologists." />

    <!-- OpenGraph & Social Meta -->
    <meta property="og:title" content="HealNari | AI Care, Every Woman, Every Stage" />
    <meta property="og:description" content="Root-cause diagnosis and personalized treatment plans for PCOS, PCOD, and hormonal imbalances." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://healnari.care" />
    <meta property="og:image" content="/brand/logo-full.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HealNari | Clinical Care for PCOS" />
    <meta name="twitter:description" content="Personalized, doctor-led protocols for women's hormonal health." />

    <!-- DNS Prefetching & Resource Hints for Performance -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">

    <!-- Google Fonts: Inter & Playfair Display (Official HealNari Typography) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400;1,600;1,700&family=Satisfy&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "MedicalOrganization",
          "@id": "https://healnari.care/#organization",
          "name": "HealNari",
          "url": "https://healnari.care",
          "logo": "https://healnari.care/logo.png",
          "medicalSpecialty": [
            "https://schema.org/Gynecologic",
            "https://schema.org/Endocrine"
          ],
          "description": "AI Care, Every Woman, Every Stage — Premium doctor-led telemedicine platform specializing in root-cause diagnosis for PCOS, hormonal imbalances, and reproductive health.",
          "aggregateRating": {
            "@type": "AggregateRating",
            "ratingValue": "4.98",
            "reviewCount": "2014"
          }
        }
      ]
    }
    </script>
  </head>
  <body class="bg-aubergine-50/30 text-slate-700 antialiased scroll-smooth">
    <div id="root">
      <!-- PWA Pre-render Loader (App Shell) -->
      <style>
        body, html { margin: 0; padding: 0; height: 100%; background-color: #fdfcff; overflow: hidden; }
        .pwa-loader-wrapper {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
          width: 100vw;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
          position: relative;
        }
        .pwa-medical-group {
          position: relative;
          display: flex;
          flex-direction: column;
          align-items: center;
          margin-bottom: 20px;
        }
        .pwa-loader-logo {
          width: 50px;
          height: 50px;
          border-radius: 12px;
          box-shadow: 0 8px 25px rgba(89, 46, 113, 0.3);
          animation: cross-float 2.5s ease-in-out infinite;
          margin-bottom: 10px;
          position: relative;
          z-index: 10;
        }
        
        .ekg-container {
          width: 180px;
          height: 60px;
          position: relative;
        }
        .ekg-line {
          stroke: #10B981; /* Medical Emerald */
          stroke-width: 3.5;
          stroke-linecap: round;
          stroke-linejoin: round;
          fill: none;
          stroke-dasharray: 400;
          stroke-dashoffset: 400;
          animation: ekg-draw 2.5s linear infinite;
        }
        .ekg-glow {
          stroke: rgba(16, 185, 129, 0.5);
          stroke-width: 8;
          stroke-linecap: round;
          stroke-linejoin: round;
          fill: none;
          stroke-dasharray: 400;
          stroke-dashoffset: 400;
          animation: ekg-draw 2.5s linear infinite;
          filter: blur(4px);
        }
        
        .pwa-loader-text {
          color: #592E71;
          font-weight: 900;
          font-size: 16px;
          letter-spacing: 2px;
          text-transform: uppercase;
        }
        .pwa-loader-subtext {
          color: #10B981;
          font-size: 11px;
          margin-top: 8px;
          letter-spacing: 2.5px;
          text-transform: uppercase;
          font-weight: 700;
          animation: ekg-fade 1.25s infinite alternate;
        }
        
        @keyframes ekg-draw {
          0% { stroke-dashoffset: 400; }
          50% { stroke-dashoffset: 0; }
          100% { stroke-dashoffset: -400; }
        }
        @keyframes cross-float {
          0%, 100% { transform: translateY(0); }
          50% { transform: translateY(-8px); }
        }
        @keyframes ekg-fade {
          from { opacity: 0.3; }
          to { opacity: 1; }
        }
      </style>
      <div class="pwa-loader-wrapper">
        <div class="pwa-medical-group">
          <img src="/brand/logo-icon.jpg" alt="HealNari Logo" class="pwa-loader-logo" />
          <div class="ekg-container">
            <svg viewBox="0 0 180 60" width="100%" height="100%">
              <path class="ekg-glow" d="M 0 30 L 40 30 L 50 10 L 65 55 L 85 5 L 105 45 L 115 30 L 180 30" />
              <path class="ekg-line" d="M 0 30 L 40 30 L 50 10 L 65 55 L 85 5 L 105 45 L 115 30 L 180 30" />
            </svg>
          </div>
        </div>
        <div class="pwa-loader-text">HealNari EHR</div>
        <div class="pwa-loader-subtext">Initializing Clinical Data...</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
